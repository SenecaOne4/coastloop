<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CoastLoop NDA · Acceptance</title><link rel="stylesheet" href="/styles.css">
<style>.nda-shell{max-width:720px;margin:8vh auto}.nda-card{padding:32px}.nda-doc{display:inline-flex;margin:10px 0 22px}.nda-consent{display:flex;gap:12px;align-items:flex-start;margin:18px 0}.nda-consent input{width:auto;margin-top:5px}.nda-error{color:#a22;margin-top:12px}</style></head>
<body><main class="shell nda-shell"><section class="card nda-card"><div class="brand coastloop-lockup"><img class="coastloop-mark" src="/brand/coastloop-mark.svg"><span>COASTLOOP</span></div>
<h1>Review the CoastLoop NDA</h1><p class="muted">Before you continue to your account, review and accept the current CoastLoop NDA.</p>
<div id="document"></div><form id="accept-form" hidden><label class="nda-consent"><input id="agree" type="checkbox" required><span>I have reviewed the linked NDA and agree to its terms.</span></label><button id="accept" type="submit">Accept and continue</button></form>
<p id="status" class="muted" role="status"></p><p id="error" class="nda-error" role="alert"></p><a id="back" href="/login">Return to sign in</a></section></main><script type="module" src="/nda.js"></script></body></html>
