<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signing in — CoastLoop</title><link rel="stylesheet" href="/styles.css">
<style>
:root{color-scheme:dark}
html,body.auth-flow{background:#0b0c0e;color:#f4f4f2}
.auth-flow .public-eyebrow{color:#f0c36a}
.auth-flow .public-lede{color:#9ca3af}
</style></head>
<body class="auth-flow"><main class="public-section"><div class="public-eyebrow">COASTLOOP</div><h2>Signing you in…</h2><p id="msg" class="public-lede">Connecting your Google account.</p></main>
<script type="module">
import {saveSession} from '/session.js';
const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.slice(1));
const raw=q.get('next')||'/advertise',next=raw.startsWith('/')&&!raw.startsWith('//')?raw:'/advertise';
const msg=document.getElementById('msg'),access=h.get('access_token');
if(access){
 saveSession({access_token:access,refresh_token:h.get('refresh_token'),expires_in:Number(h.get('expires_in')||3600),expires_at:Number(h.get('expires_at')||0),token_type:h.get('token_type')||'bearer'});
 fetch('/api/auth/nda/status',{headers:{authorization:`Bearer ${access}`}})
  .then(async r=>({ok:r.ok,data:await r.json().catch(()=>({}))}))
  .then(({ok,data})=>{
   if(!ok){msg.textContent=data.error==='nda_status_unavailable'?'NDA status could not be verified. Please try again.':'Your CoastLoop account could not be verified.';return;}
   if(data.nda?.required&&(!data.nda.configured||!data.nda.accepted)){location.replace('/nda.html?next='+encodeURIComponent(next));return;}
   location.replace(next);
  }).catch(()=>{msg.textContent='NDA status could not be verified. Please try again.';});
}else msg.textContent=h.get('error_description')||q.get('error_description')||'Google sign-in could not be completed.';
</script></body></html>
