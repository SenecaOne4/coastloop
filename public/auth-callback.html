<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signing in — CoastLoop</title><link rel="stylesheet" href="/styles.css"></head>
<body class="public-site"><main class="public-section"><div class="public-eyebrow">COASTLOOP</div><h2>Signing you in…</h2><p id="msg" class="public-lede">Connecting your Google account.</p></main>
<script type="module">
import {saveSession} from '/session.js';
const q=new URLSearchParams(location.search);
const h=new URLSearchParams(location.hash.slice(1));
const next=q.get('next')||'/advertise';
const safeNext=next.startsWith('/')&&!next.startsWith('//')?next:'/advertise';
const access=h.get('access_token');
if(access){
  saveSession({
    access_token:access,
    refresh_token:h.get('refresh_token'),
    expires_in:Number(h.get('expires_in')||3600),
    expires_at:Number(h.get('expires_at')||0),
    token_type:h.get('token_type')||'bearer'
  });
  location.replace(safeNext);
}else{
  document.getElementById('msg').textContent=h.get('error_description')||q.get('error_description')||'Google sign-in could not be completed.';
}
</script></body></html>
