<!doctype html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account · CoastLoop</title><link rel="stylesheet" href="/styles.css">
</head><body><main class="shell" style="max-width:720px">
<div class="topbar"><div class="brand coastloop-lockup"><img class="coastloop-mark" src="/brand/coastloop-mark.svg"><span>COASTLOOP</span></div><button id="back" class="secondary">Back</button></div>
<section class="card"><h1>My account</h1><div id="who" class="muted"></div>
<h2 style="margin-top:28px">Change password</h2>
<form id="password" class="row">
<input name="password" type="password" minlength="10" placeholder="New password" required>
<input name="confirm" type="password" minlength="10" placeholder="Confirm password" required>
<button>Update password</button>
</form><div id="msg" class="muted"></div>
<hr style="margin:28px 0;border:0;border-top:1px solid var(--line)">
<button id="logout" class="secondary">Sign out</button>
</section></main><script type="module" src="/account.js"></script></body></html>
