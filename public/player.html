<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CoastLoop Player</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root{--paper:#f4efe7;--wine:#7b243c;--gold:#b8924a;--muted:#a9a39b}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#070707;color:var(--paper);overflow:hidden;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#070707}
    #stage img,#stage video{width:100%;height:100%;object-fit:contain;background:#000}
    .pair{width:min(940px,86vw);text-align:center;padding:7vh 5vw}
    .player-mark{width:clamp(74px,8vw,124px);height:auto;margin-bottom:3.5vh}
    .player-wordmark{font-size:clamp(25px,3.5vw,50px);font-weight:900;letter-spacing:.32em;margin-left:.32em}
    .pair-label{margin-top:5vh;color:var(--muted);font-size:clamp(12px,1.25vw,18px);font-weight:800;letter-spacing:.24em}
    .pair .code{font-size:clamp(76px,13vw,190px);line-height:1;font-weight:850;letter-spacing:.13em;
      margin:.12em 0;color:var(--paper);font-variant-numeric:tabular-nums}
    .pair-rule{width:64px;height:2px;background:var(--gold);margin:3vh auto}
    .muted{color:var(--muted);font-size:clamp(14px,1.55vw,24px);line-height:1.55}
    .pair-foot{margin-top:5vh;color:#69645e;font-size:clamp(10px,1vw,14px);letter-spacing:.16em}
  </style>
</head>
<body>
  <div id="stage">
    <div class="pair">
      <img class="player-mark" src="/brand/coastloop-mark.svg" alt="">
      <div class="player-wordmark">COASTLOOP</div>
      <div class="pair-label">STARTING PLAYER</div>
    </div>
  </div>
  <script type="module" src="/player.js"></script>
</body>
</html>
