<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My CoastLoop</title>
<link rel="stylesheet" href="/styles.css">
<style>
body{background:#11100f;color:#f6f2ed}
.portal-shell{max-width:1180px;margin:auto;padding:22px 24px 80px}
.portal-top{display:flex;align-items:center;justify-content:space-between;padding:5px 0 35px}
.portal-brand{text-decoration:none;color:inherit;font-weight:900;letter-spacing:.08em}
.portal-account{border:1px solid #3b3531;background:#191715;color:#fff;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}
.portal-command{padding:32px 0 12px}.portal-welcome{display:flex;justify-content:space-between;gap:24px}
.portal-welcome h1{font-size:clamp(44px,7vw,76px);letter-spacing:-.055em;line-height:.96;margin:10px 0 14px}
.portal-eyebrow{font-size:11px;letter-spacing:.17em;font-weight:900;color:#a99f98}
.public-lede,.muted{color:#bdb4ad;line-height:1.55}
.portal-summary-grid,.portal-metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:28px 0}
.portal-metric{background:#191715;border:1px solid #302c29;border-radius:16px;padding:20px}
.portal-metric strong{display:block;font-size:28px;letter-spacing:-.04em}.portal-metric span{color:#aaa19a;font-size:12px}
.portal-section-head{display:flex;justify-content:space-between;align-items:end;margin:42px 0 14px}
.portal-section-head h2{margin:6px 0 0;font-size:28px}
.portal-choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.portal-choice{display:block;text-decoration:none;color:inherit;background:#191715;border:1px solid #302c29;border-radius:18px;padding:24px;min-height:185px;transition:.15s}
.portal-choice:hover{transform:translateY(-2px);border-color:#5a514b}
.portal-choice h2{font-size:27px;letter-spacing:-.035em;margin:10px 0}
.button-link{display:inline-block;margin-top:14px;font-weight:900;color:#fff}
.portal-business{border-top:1px solid #302c29;margin-top:54px;padding-top:38px}
.portal-business-title h2{font-size:38px;letter-spacing:-.045em;margin:7px 0 20px}
.portal-zone{margin:18px 0 32px}.portal-zone-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:14px}
.portal-location-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.portal-location,.portal-card,.portal-screen{background:#191715;border:1px solid #302c29;border-radius:15px;padding:17px}
.portal-card-head{display:flex;justify-content:space-between;gap:15px;align-items:start}
.portal-status{font-size:10px;font-weight:900;letter-spacing:.1em;color:#aaa}.portal-status.live{color:#fff}
.portal-empty,.portal-empty-state{color:#aaa49d;background:#171513;border:1px dashed #39332f;border-radius:16px;padding:24px}
.portal-empty-state{margin-top:38px}.portal-empty-state h2{color:#fff;font-size:30px;margin:8px 0}
.portal-health{font-size:11px;font-weight:800}.portal-screen{margin-top:10px}
.error{color:#ffb4a8}
@media(max-width:760px){
.portal-shell{padding:18px 16px 60px}.portal-summary-grid,.portal-metric-grid,.portal-choice-grid,.portal-location-grid{grid-template-columns:1fr}
.portal-welcome h1{font-size:48px}.portal-business-title h2{font-size:31px}
}
</style>
<link rel="stylesheet" href="/coastloop-ui.css">
</head>
<body class="cl-ui cl-app-body">
<div class="cl-app-shell">
  <aside class="cl-sidebar">
    <div class="cl-workspace-wrap">
      <button id="workspaceToggle" class="cl-workspace-button" type="button" aria-expanded="false">
        <span id="workspaceAvatar" class="cl-workspace-avatar cl-workspace-logo"><img src="/brand/coastloop-mark.svg" alt=""></span>
        <span class="cl-workspace-copy">
          <strong id="workspaceName">CoastLoop</strong>
          <small>Workspace</small>
        </span>
        <span class="cl-menu-chevrons">⌃⌄</span>
      </button>
      <div id="workspaceMenu" class="cl-popover cl-workspace-menu" hidden></div>
    </div>

    <nav class="cl-side-nav" aria-label="CoastLoop">
      <a class="cl-side-link is-active" href="#overview"><span class="cl-side-icon"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 8.5 10 3l6.5 5.5v7.5h-5v-4.5h-3V16h-5Z"/></svg></span><span>Overview</span></a>
      <a class="cl-side-link" href="#create-ad"><span class="cl-side-icon"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg></span><span>Create ad</span></a>
      <a class="cl-side-link" href="#creative"><span class="cl-side-icon"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3.5" y="4.5" width="13" height="11" rx="2"/><path d="M6.5 8h7M6.5 11h4.5"/></svg></span><span>Your ads</span></a>
      <a class="cl-side-link" href="#brand-library"><span class="cl-side-icon"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m10 3 6 7-6 7-6-7Z"/><path d="M7.5 10h5"/></svg></span><span>Brand library</span></a>
      <a class="cl-side-link" href="#delivery"><span class="cl-side-icon"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 15 15 5M8 5h7v7"/></svg></span><span>Delivery</span></a>
      <a class="cl-side-link" href="#billing"><span class="cl-side-icon"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M13.5 6.5c-.8-1-2-1.5-3.5-1.5-2 0-3.5 1-3.5 2.5S8 10 10 10s3.5 1 3.5 2.5S12 15 10 15c-1.6 0-2.9-.6-3.7-1.7M10 3.5v13"/></svg></span><span>Billing</span></a>
    </nav>

    <div class="cl-sidebar-bottom">
      <a class="cl-side-link cl-side-muted" href="/host"><span class="cl-side-icon"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="10" rx="2"/><path d="M7 17h6M10 14v3"/></svg></span><span>Host a screen</span></a>
      <a class="cl-side-link cl-side-muted" href="/"><span class="cl-side-icon"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 5H5.5A1.5 1.5 0 0 0 4 6.5v8A1.5 1.5 0 0 0 5.5 16h8a1.5 1.5 0 0 0 1.5-1.5V12M11 4h5v5M9 11l7-7"/></svg></span><span>Website</span></a>

      <div class="cl-user-wrap">
        <button id="account" class="cl-user-button" type="button" aria-expanded="false">
          <span id="userAvatar" class="cl-user-avatar">C</span>
          <span class="cl-user-copy">
            <strong id="userName">Account</strong>
            <small id="userEmail">CoastLoop</small>
          </span>
          <span class="cl-user-more">•••</span>
        </button>
        <div id="userMenu" class="cl-popover cl-user-menu" hidden>
          <a href="/account">Account settings <span>→</span></a>
          <a href="/">CoastLoop website <span>↗</span></a>
          <button id="portalLogout" type="button">Sign out <span>→</span></button>
        </div>
      </div>
    </div>
  </aside>

  <main class="portal-shell">
    <div id="overview" class="cl-anchor"></div>
    <div id="error" class="error"></div>
    <div id="app"></div>
  </main>
</div>
<script type="module" src="/portal.js"></script>
<script src="/legal-gate.js"></script>
</body>
</html>
