<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f3ec"><title>CoastLoop — Order Review</title><link rel="stylesheet" href="/styles.css"><style>
body{background:#f7f3ec;color:#171412}.wrap{width:min(760px,calc(100% - 24px));margin:auto;padding:24px 0 70px}.card{background:#fffdf9;border:1px solid #ded7cc;border-radius:20px;padding:21px;margin:14px 0}h1{font-size:clamp(38px,8vw,60px);letter-spacing:-.06em;line-height:.95}.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 16px}.kv dt,.muted{color:#655e58}.kv dd{margin:0;font-weight:650}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid input{padding:13px;border:1px solid #d7d0c5;border-radius:11px;font:inherit}.full{grid-column:1/-1}.check{display:flex;gap:10px;margin:12px 0}.check input{width:19px}.btn{border:0;background:#171412;color:#fff;border-radius:13px;padding:14px;font:inherit;font-weight:800;width:100%;cursor:pointer}.secondary{background:transparent;color:#171412;border:1px solid #ded7cc}.terms{display:none;margin-top:14px}.terms.open{display:block}.terms iframe{width:100%;height:58vh;border:1px solid #ddd;border-radius:10px}.err{color:#9c2535}.sig{font-family:Georgia,serif!important;font-style:italic;font-size:21px!important}.done{text-align:center}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.kv{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><a href="/"><strong>CoastLoop</strong></a><div id="loading" class="card">Opening your order…</div><div id="app" hidden><section class="card"><div class="muted">ADVERTISING ORDER</div><h1>Review. Accept. Start.</h1><p class="muted">Your package version is frozen to this order.</p></section><section class="card"><h2>Order Summary</h2><dl id="summary" class="kv"></dl><p class="muted">Projected plays are delivery projections, not human views or impressions.</p></section><section class="card"><h2>Terms</h2><button id="view" class="btn secondary">View full terms</button><div id="terms" class="terms"><p id="version" class="muted"></p><iframe id="frame" sandbox=""></iframe></div></section><section class="card"><h2>Accept order</h2><div class="grid"><input id="name" placeholder="Signer legal name"><input id="title" placeholder="Title"><input id="email" type="email" placeholder="Email"><input id="mobile" placeholder="Mobile"><input id="sig" class="full sig" placeholder="Type your legal name as signature"></div><label class="check"><input id="c1" type="checkbox">I consent to electronic records and signatures.</label><label class="check"><input id="c2" type="checkbox">I am authorized to bind the advertiser.</label><label class="check"><input id="c3" type="checkbox">The Order Summary is correct.</label><label class="check"><input id="c4" type="checkbox">I had the opportunity to review the full terms.</label><div id="err" class="err"></div><button id="accept" class="btn">Accept order & prepare invoice</button></section></div><section id="done" class="card done" hidden><h1>You're in the Loop.</h1><p id="pay" class="muted"></p><a id="agreement" target="_blank" rel="noopener">View executed order</a></section><div id="fatal" class="card" hidden></div></main><script src="/checkout.js" defer></script></body></html>
