<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>Sign in · CoastLoop</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/coastloop-ui.css">
</head>
<body class="cl-ui">

<main class="cl-auth-shell">
  <section class="cl-auth-card">
    <a class="cl-auth-brand" href="/">
      <img src="/brand/coastloop-mark.svg" alt="">
      <span>CoastLoop</span>
    </a>

    <div id="normal">
      <div class="cl-eyebrow">NETWORK ACCESS</div>
      <h1 id="authTitle">Log in</h1>
      <p id="authLead" class="cl-auth-lead">Hosts, advertisers and CoastLoop staff.</p>

      <div id="authLogin">
        <form id="login" class="cl-auth-form">
          <input name="email" type="email" placeholder="Email" autocomplete="email" required>
          <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
          <button class="cl-btn cl-btn-primary cl-btn-lg" type="submit">Sign in</button>
        </form>
      </div>

      <div id="authSignup" hidden>
        <form id="signup" class="cl-auth-form">
          <input name="full_name" placeholder="Name" autocomplete="name">
          <input name="email" type="email" placeholder="Email" autocomplete="email" required>
          <input name="password" type="password" minlength="10" placeholder="Password (10+ characters)" autocomplete="new-password" required>
          <input name="confirm" type="password" minlength="10" placeholder="Confirm password" autocomplete="new-password" required>
          <button class="cl-btn cl-btn-primary cl-btn-lg" type="submit">Create account</button>
        </form>
      </div>

      <div class="cl-auth-switch">
        <span id="authPrompt">New to CoastLoop?</span>
        <a href="#" id="authToggle">Create an account</a>
      </div>

      <div id="googleWrap" hidden>
        <div class="cl-auth-divider"><span>or</span></div>
        <button id="google" class="cl-btn cl-auth-google" type="button">
          <span aria-hidden="true">G</span>
          Continue with GENNY
        </button>
      </div>

      <a class="cl-auth-forgot" href="/reset-password">Forgot password?</a>

      <details id="inviteActivation" class="cl-auth-details">
        <summary>Have an invitation?</summary>
        <form id="activate" class="cl-auth-form">
          <input name="full_name" placeholder="Name" autocomplete="name">
          <input name="email" type="email" placeholder="Invitation email" autocomplete="email" required>
          <input name="password" type="password" minlength="10" placeholder="Create password (10+ characters)" required>
          <input name="confirm" type="password" minlength="10" placeholder="Confirm password" required>
          <button class="cl-btn cl-btn-primary" type="submit">Activate CoastLoop account</button>
        </form>
      </details>
    </div>

    <div id="bootstrap" hidden>
      <div class="cl-eyebrow">OWNER SETUP</div>
      <h1>Create owner account</h1>
      <p class="cl-auth-lead">Initial CoastLoop account setup.</p>
      <form id="owner" class="cl-auth-form">
        <input name="full_name" placeholder="Name" autocomplete="name">
        <input name="email" type="email" placeholder="Owner email" autocomplete="email" required>
        <input name="password" type="password" minlength="10" placeholder="New password (10+ characters)" required>
        <input name="confirm" type="password" minlength="10" placeholder="Confirm password" required>
        <input id="setupKey" name="setup_key" type="password" placeholder="Legacy admin key (only if needed)">
        <button class="cl-btn cl-btn-primary cl-btn-lg" type="submit">Create owner account</button>
      </form>
    </div>

    <div id="msg" class="cl-auth-message" aria-live="polite"></div>
  </section>
</main>

<script type="module" src="/login.js"></script>
</body>
</html>
